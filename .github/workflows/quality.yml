name: Data quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild analytical tables
        run: python src/transform_data.py
      - name: Run data-quality tests
        run: python -m unittest discover -s tests -v
      - name: Confirm generated data are committed
        run: git diff --exit-code -- data/processed
